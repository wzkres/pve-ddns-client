general:
  update-interval-ms: 300000
  max-log-files: 5
  max-log-size-mb: 2
  log-level: info
  spdlog-pattern: "[%Y-%m-%d %H:%M:%S.%e][P%P-T%t][%L][%s:%#] %v"
  service-mode: true
  module-path:
    ip: "./ip_services"
    dns: "./dns_services"
  public-ip:
    service: porkbun
    credentials: api_key,secret_key
  pve-api:
    host: https://pve.domain.com:8006
    user: root
    realm: pam
    token-id: ddns
    token-uuid: uuid
  sync_host_static_v6_address: false
client:
  dns: dnspod
  credentials: token_id,token
  ipv4: ["v4sub1.domain.com", "v4sub2.domain.com"]
  ipv6: ["v6sub1.domain.com", "v6sub2.domain.com"]
host:
  node: node
  iface: vmbr0
  dns: porkbun
  credentials: api_key,secret_key
  ipv4: ["v4sub1.domain.com", "v4sub2.domain.com"]
  ipv6: ["v6sub1.domain.com", "v6sub2.domain.com"]
guests:
  - node: node
    vmid: 100
    iface: ens18
    dns: porkbun
    credentials: api_key,secret_key
    ipv4: ["v4sub1.domain.com", "v4sub2.domain.com"]
    ipv6: ["v6sub1.domain.com", "v6sub2.domain.com"]
  - node: node
    vmid: 101
    iface: ens18
    dns: porkbun
    credentials: api_key,secret_key
    ipv4: ["v4sub1.domain.com", "v4sub2.domain.com"]
    ipv6: ["v6sub1.domain.com", "v6sub2.domain.com"]
